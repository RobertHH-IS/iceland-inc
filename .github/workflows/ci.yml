name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * *' # nightly
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - name: Harness
        # the full run: the half-step test also measures each check's order of convergence (decision 0011)
        run: |
          if [ -f src/harness/cli.ts ]; then bun run harness --full; else echo "harness not yet present"; fi
      - name: Lever report
        # fails on a broken run or an expectation that does not hold (docs/authoring.md §12)
        run: bun run levers
